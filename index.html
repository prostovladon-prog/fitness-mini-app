<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фитнес-Эксперт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 500px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--tg-theme-button-color, #2481cc);
    color: white; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 18px;
    flex-shrink: 0;
  }
  h1 { font-size: 20px; }
  .subtitle { color: var(--tg-theme-hint-color, #888); font-size: 13px; margin-top: 2px; }
  .card {
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    border-radius: 12px; padding: 16px; margin-bottom: 10px;
    cursor: pointer; transition: transform 0.1s;
  }
  .card:active { transform: scale(0.98); }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .card p { font-size: 13px; color: var(--tg-theme-hint-color, #888); }
  .btn {
    display: block; width: 100%; padding: 14px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, white);
    border: none; border-radius: 10px; font-size: 16px;
    font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  .btn:active { opacity: 0.8; }
  .btn-secondary {
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000);
  }
  .back-btn {
    background: none; border: none; color: var(--tg-theme-link-color, #2481cc);
    font-size: 15px; cursor: pointer; padding: 4px 0; margin-bottom: 16px;
  }
  .input-group { margin-bottom: 14px; }
  .input-group label {
    display: block; font-size: 13px; margin-bottom: 6px;
    color: var(--tg-theme-hint-color, #888);
  }
  .input-group input {
    width: 100%; padding: 12px; font-size: 16px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    border: 1px solid var(--tg-theme-hint-color, #ddd);
    border-radius: 8px; color: var(--tg-theme-text-color, #000);
  }
  .exercise-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    border-radius: 10px; padding: 14px; margin-bottom: 8px;
  }
  .exercise-item .info { flex: 1; }
  .exercise-item .name { font-weight: 600; font-size: 15px; }
  .exercise-item .last {
    font-size: 12px; color: var(--tg-theme-hint-color, #888);
    margin-top: 4px;
  }
  .delete-btn {
    background: none; border: none; font-size: 20px;
    cursor: pointer; padding: 4px 8px; opacity: 0.6;
  }
  .history-item {
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    border-radius: 8px; padding: 12px; margin-bottom: 6px;
    display: flex; justify-content: space-between; font-size: 14px;
  }
  .history-date { color: var(--tg-theme-hint-color, #888); font-size: 12px; }
  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--tg-theme-hint-color, #888); font-size: 14px;
  }
  .screen { display: none; }
  .screen.active { display: block; }
</style>
</head>
<body>
<div class="container">

  <!-- ЭКРАН 1: ГЛАВНЫЙ -->
  <div id="screen-home" class="screen active">
    <div class="header">
      <div class="avatar" id="avatar">?</div>
      <div>
        <h1 id="userName">Привет!</h1>
        <div class="subtitle">Фитнес-Эксперт</div>
      </div>
    </div>

    <div class="card" onclick="showScreen('screen-workouts')">
      <h3>🍎 Дневник питания</h3>
      <p>Скоро появится: БЖУ и калории</p>
    </div>

    <div class="card" onclick="showScreen('screen-workouts')">
      <h3>💪 Тренировки</h3>
      <p>Записывай упражнения и прогрессию</p>
    </div>

    <div class="card">
      <h3>🤖 ИИ-Эксперт</h3>
      <p>Скоро появится: советы по тренировкам</p>
    </div>
  </div>

  <!-- ЭКРАН 2: ТРЕНИРОВКИ -->
  <div id="screen-workouts" class="screen">
    <button class="back-btn" onclick="showScreen('screen-home')">← Назад</button>
    <h1 style="margin-bottom:16px;">💪 Мои упражнения</h1>
    <div id="exercisesList"></div>
    <button class="btn" onclick="showScreen('screen-add')">+ Добавить упражнение</button>
  </div>

  <!-- ЭКРАН 3: ДОБАВЛЕНИЕ УПРАЖНЕНИЯ -->
  <div id="screen-add" class="screen">
    <button class="back-btn" onclick="showScreen('screen-workouts')">← Назад</button>
    <h1 style="margin-bottom:16px;">Новое упражнение</h1>
    <div class="input-group">
      <label>Название упражнения</label>
      <input id="exName" placeholder="Например: Жим лёжа">
    </div>
    <div class="input-group">
      <label>Вес (кг)</label>
      <input id="exWeight" type="number" step="0.5" placeholder="60">
    </div>
    <div class="input-group">
      <label>Повторения</label>
      <input id="exReps" type="number" placeholder="10">
    </div>
    <button class="btn" onclick="addExercise()">Сохранить</button>
  </div>

  <!-- ЭКРАН 4: ИСТОРИЯ УПРАЖНЕНИЯ -->
  <div id="screen-history" class="screen">
    <button class="back-btn" onclick="showScreen('screen-workouts')">← Назад</button>
    <h1 id="historyTitle" style="margin-bottom:16px;"></h1>
    <div id="historyList"></div>
    <button class="btn" onclick="showScreen('screen-add-approach')">+ Добавить подход</button>
  </div>

  <!-- ЭКРАН 5: ДОБАВЛЕНИЕ ПОДХОДА -->
  <div id="screen-add-approach" class="screen">
    <button class="back-btn" onclick="showScreen('screen-history')">← Назад</button>
    <h1 style="margin-bottom:16px;">Новый подход</h1>
    <div class="input-group">
      <label>Вес (кг)</label>
      <input id="apWeight" type="number" step="0.5" placeholder="60">
    </div>
    <div class="input-group">
      <label>Повторения</label>
      <input id="apReps" type="number" placeholder="10">
    </div>
    <button class="btn" onclick="addApproach()">Сохранить</button>
  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const user = tg.initDataUnsafe?.user;
  if (user) {
    document.getElementById('userName').textContent = user.first_name || 'Привет!';
    document.getElementById('avatar').textContent = (user.first_name?.[0] || '?').toUpperCase();
  }

  // ---- Работа с данными ----
  const STORAGE_KEY = 'fitness_exercises';

  function loadData() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { return []; }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let currentExerciseId = null;

  // ---- Навигация ----
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    if (id === 'screen-workouts') renderExercises();
    if (id === 'screen-history') renderHistory();
  }

  // ---- Тренировки ----
  function renderExercises() {
    const list = document.getElementById('exercisesList');
    const data = loadData();

    if (data.length === 0) {
      list.innerHTML = '<div class="empty">Пока нет упражнений.<br>Добавьте первое! 👇</div>';
      return;
    }

    list.innerHTML = data.map(ex => {
      const last = ex.history[ex.history.length - 1];
      const lastText = last ? `Последний: ${last.weight} кг × ${last.reps}` : 'Нет записей';
      return `
        <div class="exercise-item">
          <div class="info" onclick="openHistory(${ex.id})">
            <div class="name">${ex.name}</div>
            <div class="last">${lastText}</div>
          </div>
          <button class="delete-btn" onclick="deleteExercise(${ex.id}); event.stopPropagation();">🗑</button>
        </div>
      `;
    }).join('');
  }

  function addExercise() {
    const name = document.getElementById('exName').value.trim();
    const weight = parseFloat(document.getElementById('exWeight').value);
    const reps = parseInt(document.getElementById('exReps').value);

    if (!name) return alert('Введите название');
    if (!weight || !reps) return alert('Введите вес и повторения');

    const data = loadData();
    data.push({
      id: Date.now(),
      name: name,
      history: [{ weight, reps, date: new Date().toISOString() }]
    });
    saveData(data);

    document.getElementById('exName').value = '';
    document.getElementById('exWeight').value = '';
    document.getElementById('exReps').value = '';

    showScreen('screen-workouts');
  }

  function deleteExercise(id) {
    if (!confirm('Удалить упражнение?')) return;
    const data = loadData().filter(ex => ex.id !== id);
    saveData(data);
    renderExercises();
  }

  // ---- История ----
  function openHistory(id) {
    currentExerciseId = id;
    const ex = loadData().find(e => e.id === id);
    if (!ex) return;
    document.getElementById('historyTitle').textContent = ex.name;
    showScreen('screen-history');
  }

  function renderHistory() {
    const ex = loadData().find(e => e.id === currentExerciseId);
    if (!ex) return;

    const list = document.getElementById('historyList');
    if (ex.history.length === 0) {
      list.innerHTML = '<div class="empty">Нет записей</div>';
      return;
    }

    list.innerHTML = [...ex.history].reverse().map(h => {
      const d = new Date(h.date);
      const dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      return `
        <div class="history-item">
          <span>${h.weight} кг × ${h.reps}</span>
          <span class="history-date">${dateStr}</span>
        </div>
      `;
    }).join('');
  }

  function addApproach() {
    const weight = parseFloat(document.getElementById('apWeight').value);
    const reps = parseInt(document.getElementById('apReps').value);

    if (!weight || !reps) return alert('Введите вес и повторения');

    const data = loadData();
    const ex = data.find(e => e.id === currentExerciseId);
    if (!ex) return;

    ex.history.push({ weight, reps, date: new Date().toISOString() });
    saveData(data);

    document.getElementById('apWeight').value = '';
    document.getElementById('apReps').value = '';

    showScreen('screen-history');
  }
</script>
</body>
</html>
