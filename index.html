<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-Эксперт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .subtitle { color: var(--tg-theme-hint-color, #888); margin-bottom: 30px; font-size: 14px; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .card h3 { font-size: 16px; margin-bottom: 8px; }
        .card p { font-size: 14px; color: var(--tg-theme-hint-color, #888); }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--tg-theme-button-color, #2481cc);
            color: white; display: flex; align-items: center;
            justify-content: center; font-weight: bold; font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-info">
            <div class="avatar" id="avatar">?</div>
            <div>
                <h1 id="userName">Привет!</h1>
                <div class="subtitle">Добро пожаловать в Фитнес-Эксперт</div>
            </div>
        </div>

        <div class="card">
            <h3>🍎 Дневник питания</h3>
            <p>Здесь будет запись БЖУ и калорий</p>
        </div>

        <div class="card">
            <h3>💪 Тренировки</h3>
            <p>Здесь будут упражнения и прогрессия весов</p>
        </div>

        <div class="card">
            <h3>🤖 ИИ-Эксперт</h3>
            <p>Персональные советы по тренировкам</p>
        </div>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').textContent = user.first_name || 'Привет!';
            const initial = (user.first_name?.[0] || '?').toUpperCase();
            document.getElementById('avatar').textContent = initial;
        }
    </script>
</body>
</html>
